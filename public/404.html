<!doctype html>
<html lang="sv-se">
  <head>
    <meta charset="utf-8" />
    <title>Receptbanken</title>
    <script>
      // Redirects unknown paths back to index.html encoding the original path
      // as a query string so BrowserRouter can restore it.
      // pathSegmentsToKeep = 1 accounts for the /RecipeBank/ repo prefix.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
</html>
